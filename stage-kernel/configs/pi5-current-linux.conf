# Fragment extracted from linux/.config relative to bcm2712_defconfig.
# This reproduces the current Pi 5 network tuning choices without copying a
# full generated .config into the pi-gen workflow.

CONFIG_TCP_CONG_BBR=y
CONFIG_NET_SCH_FQ=y
CONFIG_DEFAULT_BBR=y
# CONFIG_DEFAULT_CUBIC is not set
CONFIG_TCP_CONG_HYBLA=m
CONFIG_TCP_CONG_DCTCP=m
CONFIG_DEFAULT_TCP_CONG="bbr"
